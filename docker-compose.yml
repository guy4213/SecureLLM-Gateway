version: '3.9'

services:
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: securellm-gateway
    ports:
      - "${PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${PORT:-3000}
      MONGO_URI: ${MONGO_URI:-mongodb://admin:password@mongo:27017/securellm?authSource=admin}
      REDIS_URI: ${REDIS_URI:-redis://redis:6379}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      PII_ENC_KEY: ${PII_ENC_KEY:-}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-60000}
      RATE_LIMIT_MAX_REQUESTS: ${RATE_LIMIT_MAX_REQUESTS:-30}
      LLM_REQUEST_TIMEOUT_MS: ${LLM_REQUEST_TIMEOUT_MS:-30000}
      LLM_CACHE_TTL_SECONDS: ${LLM_CACHE_TTL_SECONDS:-300}
      MAX_TOKENS_CAP: ${MAX_TOKENS_CAP:-2048}
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - gateway-net
    # No host-network access; the service must go through the proxy
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp

  mongo:
    image: mongo:7.0-jammy
    container_name: securellm-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: securellm
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-password}
    healthcheck:
      test: ["CMD", "sh", "-c", "mongosh --quiet -u \"$MONGO_INITDB_ROOT_USERNAME\" -p \"$MONGO_INITDB_ROOT_PASSWORD\" --authenticationDatabase admin --eval \"db.adminCommand('ping').ok\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped
    networks:
      - gateway-net

  redis:
    image: redis:7.2-alpine
    container_name: securellm-redis
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    networks:
      - gateway-net

volumes:
  mongo_data:
    driver: local
  redis_data:
    driver: local

networks:
  gateway-net:
    driver: bridge
    internal: false
